# base config
title: Rocco Sicilia's blog
email: rocco.sicilia@pm.me
description: >- # this means to ignore newlines until "baseurl:"
baseurl: "/_blog" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-paginate

# Plugin conf.
paginate: 10
paginate_path: "/page:num/"

# sass warning fix
sass:
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions
    